name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint (Biome)
        # Same file scope as the upstream Docker lint stage (src/tests/scripts);
        # legacy root config files (next.config.mjs etc.) are not lint-clean.
        run: npx biome check --max-diagnostics=200 src tests scripts .github/actions/star-history

      - name: Typecheck
        run: |
          npm run typecheck
          npm run typecheck:tests

      - name: Unit tests
        run: npm test -- --reporter=dot

      - name: Star-history action tests
        run: node --test .github/actions/star-history/index.test.js
